name: trident-p0
services:
  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: trident_test
      POSTGRES_DB: trident_test
      POSTGRES_PASSWORD: ${TRIDENT_POSTGRES_PASSWORD:?Set TRIDENT_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trident_test -d trident_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
volumes:
  postgres-data:
