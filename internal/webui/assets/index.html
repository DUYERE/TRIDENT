<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TRIDENT · 只读安全分析控制台</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><path d="M8 6h8M9 3v3M15 3v3M6 13H3M21 13h-3M6 17l-2 2M18 17l2 2M6 9l-2-2M18 9l2-2"/><rect x="7" y="6" width="10" height="13" rx="5"/><path d="M12 10v6M9 13h6"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></symbol>
    <symbol id="i-package" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5l8 4.5"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-5 4 5 4M15 8l5 4-5 4M13 4l-2 16"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 19h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21 20H3L12 3.5Z"/><path d="M12 9v5M12 17.2v.3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7.2v.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6c.5-.1.9-.1 1.4-.1 6 0 9.5 6.1 9.5 6.1a17 17 0 0 1-3.2 3.9M6.4 6.7A17 17 0 0 0 2.5 12S6 18.5 12 18.5c1.3 0 2.5-.3 3.6-.7M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 3 7 21M17 3l-2 18M4 9h16M3 15h16"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-layer" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5M3 17l9 5 9-5"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 5h11l-1.8 3.5L16 12H5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.4M12 19.1v2.4M21.5 12h-2.4M4.9 12H2.5M18.7 5.3l-1.7 1.7M7 17l-1.7 1.7M18.7 18.7 17 17M7 7 5.3 5.3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></symbol>
  </svg>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark"><img class="brand-img" src="/assets/brand.png" alt="" draggable="false"></span>
        <span class="brand-text">
          <strong>TRIDENT</strong>
          <small>SECURITY ANALYSIS</small>
        </span>
      </div>
      <nav class="nav" aria-label="主导航">
        <div class="nav-group">
          <div class="nav-label">分析</div>
          <a class="nav-item" href="#/overview" data-route="overview"><svg class="icon"><use href="#i-grid"/></svg><span>概览</span></a>
          <a class="nav-item" href="#/findings" data-route="findings"><svg class="icon"><use href="#i-bug"/></svg><span>安全发现</span><em class="nav-badge" id="navFindings" hidden>0</em></a>
          <a class="nav-item" href="#/endpoints" data-route="endpoints"><svg class="icon"><use href="#i-route"/></svg><span>HTTP 入口</span><em class="nav-badge" id="navEndpoints" hidden>0</em></a>
          <a class="nav-item" href="#/dependencies" data-route="dependencies"><svg class="icon"><use href="#i-package"/></svg><span>依赖与公告</span></a>
          <a class="nav-item" href="#/tree" data-route="tree"><svg class="icon"><use href="#i-layer"/></svg><span>依赖树</span></a>
          <a class="nav-item" href="#/reachability" data-route="reachability"><svg class="icon"><use href="#i-shield"/></svg><span>可达性</span></a>
          <a class="nav-item" href="#/runtime" data-route="runtime"><svg class="icon"><use href="#i-flag"/></svg><span>运行时关联</span></a>
        </div>
        <div class="nav-group">
          <div class="nav-label">工作区</div>
          <a class="nav-item" href="#/agent" data-route="agent"><svg class="icon"><use href="#i-server"/></svg><span>Agent 活动</span></a>
          <a class="nav-item" href="#/source" data-route="source"><svg class="icon"><use href="#i-code"/></svg><span>源码浏览</span></a>
          <a class="nav-item" href="#/about" data-route="about"><svg class="icon"><use href="#i-lock"/></svg><span>边界与关于</span></a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <div class="snap-chip" id="snapChip" title="快照摘要">
          <svg class="icon"><use href="#i-hash"/></svg>
          <span id="snapHash" class="mono">—</span>
        </div>
        <div class="foot-line">
          <span class="dot live"></span><span>只读快照</span>
          <span class="foot-sep"></span><span id="footVersion">v—</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow" id="pageEyebrow">TRIDENT / OVERVIEW</span>
          <h1 id="pageTitle">概览</h1>
        </div>
        <div class="topbar-actions">
          <span class="pill runtime" title="静态证据不等于运行时可利用"><span class="dot warn"></span>runtime_status = not_run</span>
          <button class="icon-btn" id="themeToggle" type="button" title="切换亮色/暗色主题"><svg class="icon"><use href="#i-sun"/></svg></button>
          <button class="btn ghost" id="exportBtn" type="button" title="下载统一 Finding/Hypothesis JSON">
            <svg class="icon"><use href="#i-download"/></svg><span>导出证据</span>
          </button>
          <button class="btn ghost" id="exportHtmlBtn" type="button" title="下载确定性 HTML 审阅报告（无时间戳、无外部资源）">
            <svg class="icon"><use href="#i-download"/></svg><span>导出报告</span>
          </button>
          <button class="icon-btn mobile-nav" id="mobileNav" type="button" aria-label="打开导航"><svg class="icon"><use href="#i-grid"/></svg></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
      <footer class="statusbar">
        <span><span class="dot ok"></span>服务在线</span>
        <span id="statusAnalysis">等待分析</span>
        <span class="status-spacer"></span>
        <span class="mono" id="statusHash">—</span>
      </footer>
    </div>
  </div>

  <div class="login" id="login" hidden>
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark large"><img class="brand-img" src="/assets/brand.png" alt="" draggable="false"></span>
        <div>
          <strong>TRIDENT</strong>
          <span>只读安全分析控制台</span>
        </div>
      </div>
      <p class="login-copy">输入启动 <code>trident web</code> 时终端打印的访问令牌。令牌仅保存在当前浏览器会话与本机进程内。</p>
      <label class="field" for="tokenInput">
        <span>访问令牌</span>
        <span class="input-wrap">
          <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 48 位十六进制令牌" data-search>
          <button type="button" class="input-action" id="toggleToken" aria-label="显示或隐藏令牌"><svg class="icon"><use href="#i-eye"/></svg></button>
        </span>
      </label>
      <button class="btn primary block" id="loginBtn" type="button">进入控制台</button>
      <div class="login-error" id="loginError" hidden></div>
      <div class="login-foot">
        <span><svg class="icon"><use href="#i-shield"/></svg> loopback only</span>
        <span><svg class="icon"><use href="#i-eye-off"/></svg> 无模型调用</span>
        <span><svg class="icon"><use href="#i-lock"/></svg> 只读快照</span>
      </div>
    </div>
  </div>

  <div class="drawer-layer" id="drawerLayer" hidden>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="发现详情"></aside>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/assets/app.js"></script>
</body>
</html>
