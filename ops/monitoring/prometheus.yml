global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trident-console
    metrics_path: /metrics
    scheme: http
    static_configs:
      # The console binds loopback only (hard security boundary); on Windows/macOS
      # Docker Desktop host.docker.internal reaches the host loopback. On Linux
      # use a socat sidecar or host networking instead of relaxing the console.
      - targets: ["host.docker.internal:8787"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
